<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f8a7b"/>
      <stop offset="1" stop-color="#0a5c52"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- faint staff lines -->
  <g stroke="#ffffff" stroke-opacity="0.13" stroke-width="6">
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="232" x2="416" y2="232"/>
    <line x1="96" y1="288" x2="416" y2="288"/>
    <line x1="96" y1="344" x2="416" y2="344"/>
  </g>
  <!-- the target line: notes stepping up -->
  <path d="M104 344 H176 V288 H240 V232 H304 V176 H352 V232 H408" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the playhead -->
  <line x1="272" y1="120" x2="272" y2="392" stroke="#f4a259" stroke-width="12" stroke-linecap="round"/>
  <circle cx="272" cy="232" r="24" fill="#f4a259" stroke="#ffffff" stroke-width="8"/>
</svg>
